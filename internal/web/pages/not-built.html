<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>503 · Quecto</title>
<style>
/* The dashboard's own palette, inlined. This page is what there is to render
   when the build it would otherwise style is the thing that is missing. */
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --accent: #0f766e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --surface: #1a2436;
    --border: #2e3b50;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #2dd4bf;
  }
}

html {
  color-scheme: light dark;
  background: var(--bg);
  color: var(--text);
  font-family: "Poppins", ui-sans-serif, -apple-system, BlinkMacSystemFont,
    "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body {
  margin: 0;
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 24px;
}
main {
  text-align: center;
  max-width: 32rem;
}
.code {
  margin: 0;
  font-size: clamp(84px, 22vw, 148px);
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--accent);
}
h1 {
  margin: 6px 0 10px;
  font-size: 19px;
  font-weight: 500;
}
p.note {
  margin: 0 0 18px;
  font-size: 13.5px;
  color: var(--muted);
}
pre {
  margin: 0;
  padding: 12px 14px;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px;
  overflow-x: auto;
}
</style>
<main>
  <p class="code">503</p>
  <h1>Dashboard not built</h1>
  <p class="note">
    The proxy is running normally. This binary just shipped without a face.
    Build the dashboard, then rebuild so it can be embedded:
  </p>
  <pre>make dashboard &amp;&amp; go build ./cmd/quecto</pre>
</main>
