<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Quecto</title>
<style>
/* The dashboard's own palette, inlined. This page has to render before the
   build exists and without the hashed stylesheet the build produces. */
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --accent: #0f766e;
  --btn: #0f766e;
  --btn-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --surface: #1a2436;
    --border: #2e3b50;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #2dd4bf;
    --btn: #2dd4bf;
    --btn-text: #0f172a;
  }
}

html {
  color-scheme: light dark;
  background: var(--bg);
  color: var(--text);
  font-family: "Poppins", ui-sans-serif, -apple-system, BlinkMacSystemFont,
    "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body {
  margin: 0;
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 24px;
}
main {
  text-align: center;
  max-width: 30rem;
}
.code {
  margin: 0;
  font-size: clamp(84px, 22vw, 148px);
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--accent);
}
h1 {
  margin: 6px 0 10px;
  font-size: 19px;
  font-weight: 500;
}
p.note {
  margin: 0 0 22px;
  font-size: 13.5px;
  color: var(--muted);
}
a.btn {
  display: inline-flex;
  align-items: center;
  padding: 8px 15px;
  border-radius: 6px;
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  background: var(--btn);
  color: var(--btn-text);
  transition: opacity 90ms ease;
}
a.btn:hover {
  opacity: 0.86;
}
</style>
<main>
  <p class="code">404</p>
  <h1>Not found</h1>
  <p class="note">Zero results, and not one token spent.</p>
  <a class="btn" href="/admin/">Back to the dashboard</a>
</main>
